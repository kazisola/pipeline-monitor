version: "3.8"

services:
  # MongoDB - Primary database
  mongodb:
    image: mongo:7
    container_name: pipeline_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: pipeline_db
    volumes:
      - mongo_data:/data/db

  # Redis - Cache and BullMQ message broker
  redis:
    image: redis:7-alpine
    container_name: pipeline_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Keycloak - OpenID Connect (OIDC) identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: pipeline_keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    command: start-dev

  # Mongo Express - MongoDB administration UI
  mongo-express:
    image: mongo-express:latest
    container_name: pipeline_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_URL: mongodb://admin:secret@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  mongo_data:
  redis_data: